name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # PINNED ON PURPOSE. These were previously installed unpinned, so every
          # run got whatever was latest that day. This CI passed in April 2026 and
          # failed in August on identical code, because a newer ruff started
          # enforcing I001 import sorting. An unpinned linter means the build can
          # break with no commit behind it.
          pip install "ruff==0.16.4" "pytest==9.1.1"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        # No `|| [ $? -eq 5 ]` escape. Exit code 5 means pytest collected no tests
        # at all, which is a failure worth hearing about, not a pass to swallow.
        run: pytest -q

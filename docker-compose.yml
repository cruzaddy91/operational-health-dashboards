services:
  emitter:
    build:
      context: .
      dockerfile: Dockerfile.emitter
    container_name: ohd_emitter
    ports:
      # Loopback only. Docker's short form ("9100:9100") binds 0.0.0.0 and
      # publishes to the whole LAN, which is never what a local demo wants.
      - "127.0.0.1:9100:9100"
    environment:
      EMITTER_PORT: "9100"
      EMITTER_SEED: "42"
      EMITTER_INTERVAL_SECONDS: "1.0"

  prometheus:
    image: prom/prometheus:latest
    container_name: ohd_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - emitter

  grafana:
    image: grafana/grafana:latest
    container_name: ohd_grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Override with GF_ADMIN_PASSWORD in a local .env. The fallback is a
      # known-weak value and is only acceptable because the port above is
      # bound to loopback.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      # Anonymous viewer access is deliberate, not an oversight. The whole
      # point of this repo is that `docker compose up` shows working
      # dashboards with no login step. It is safe only because nothing here
      # is reachable off this host.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
